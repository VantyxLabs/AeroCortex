services:
  mongo:
    image: mongo:7
    container_name: aerocortex-mongo
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional local Neo4j (not used by default — API uses Aura via NEO4J_URI in .env).
  # Start with: docker compose --profile local-neo4j up neo4j
  neo4j:
    profiles: ["local-neo4j"]
    image: neo4j:5.18-community
    container_name: aerocortex-neo4j
    env_file: .env
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-local-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aerocortex-ollama
    env_file: .env
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    container_name: aerocortex-api
    command: python main.py --api
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      # Neo4j comes from .env (Aura neo4j+s://…). Do not override with local Docker Bolt.
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DIR: data/knowledge/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/knowledge/chroma
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  dashboard:
    build: .
    container_name: aerocortex-dashboard
    command: python main.py --dashboard
    env_file: .env
    environment:
      DASHBOARD_PORT: "8501"
      DASHBOARD_API_URL: ${DASHBOARD_API_URL:-http://localhost:8000}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  mongo_data:
  ollama_data:
  chroma_data:
